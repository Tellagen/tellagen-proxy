{{- if .Values.bind.serviceAccount }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "diagnosis-reader.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "diagnosis-reader.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.bind.groups }}
---
# The groups mint short-lived tokens for the service account. This is the only
# right the groups get from route B, and it covers this one account.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "diagnosis-reader.tokenRoleName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "diagnosis-reader.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [{{ include "diagnosis-reader.serviceAccountName" . | quote }}]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "diagnosis-reader.tokenRoleName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "diagnosis-reader.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "diagnosis-reader.tokenRoleName" . }}
subjects:
  {{- range .Values.bind.groups }}
  - kind: Group
    name: {{ . | quote }}
    apiGroup: rbac.authorization.k8s.io
  {{- end }}
{{- end }}
{{- end }}
