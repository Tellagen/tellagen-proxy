{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tellagen-proxy.fullname" . }}
  labels:
    {{- include "tellagen-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tellagen-proxy.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 12 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        {{- range .Values.networkPolicy.tellagen.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
      {{- if .Values.networkPolicy.tellagen.cidrs }}
      to:
        {{- range .Values.networkPolicy.tellagen.cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      {{- end }}
    {{- if .Values.networkPolicy.grafana.to }}
    - to:
        {{- toYaml .Values.networkPolicy.grafana.to | nindent 8 }}
      ports:
        {{- range .Values.networkPolicy.grafana.ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
  {{- if .Values.networkPolicy.ingress.from }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingress.from | nindent 8 }}
      ports:
        - port: 8080
          protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
