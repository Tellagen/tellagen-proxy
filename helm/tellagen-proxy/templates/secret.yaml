{{- if include "tellagen-proxy.makesSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tellagen-proxy.fullname" . }}
  labels:
    {{- include "tellagen-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.tellagen.token }}
  {{ $.Values.secretKeys.tellagenToken }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.grafana.token }}
  {{ $.Values.secretKeys.grafanaToken }}: {{ . | quote }}
  {{- end }}
{{- end }}
