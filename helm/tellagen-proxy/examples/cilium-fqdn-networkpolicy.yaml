# A vanilla NetworkPolicy matches IP addresses only. With Cilium you can allow
# the hostname instead. This policy lets the proxy reach DNS, connect.tellagen.com
# on port 443 and one Grafana service, and nothing else. Replace the namespace,
# the Grafana selector and the port. The pod labels are the ones the chart sets
# for a release named tellagen-proxy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tellagen-proxy
  namespace: tellagen
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tellagen-proxy
      app.kubernetes.io/instance: tellagen-proxy
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: connect.tellagen.com
    - toFQDNs:
        - matchName: connect.tellagen.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
