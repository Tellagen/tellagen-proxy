version: "2"

run:
  go: "1.26"
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - SA*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # staticcheck does not model testing.T.Fatal as non-returning.
      - path: _test\.go
        text: SA5011
        linters:
          - staticcheck

formatters:
  exclusions:
    generated: lax
